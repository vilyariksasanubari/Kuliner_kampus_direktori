<!doctype html>
<html lang="id">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Direktori</title>
    <link rel="stylesheet" href="direktori.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="bootstrap/js/bootstrap.bundle.min.js" rel="stylesheet">
        
</head>

<body>
    <nav class="navbar navbar-expand-lg sticky-top bg-white border-bottom">
        <div class="container">
            <a class="navbar-brand fw-bold" href="beranda.html" style="color: green; text-decoration: none;"><b>🥗 JakPus</b></a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMain">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navMain">
                <ul class="navbar-nav ms-auto gap-lg-2">
                    <li class="nav-item"><a class="nav-link fw-semibold" href="beranda.html" style="color: #53645b;">Beranda</a></li>
                    <li class="nav-item"><a class="nav-link fw-semibold active" href="direktori.html" style="color: var(--green);">Direktori</a></li>
                    <li class="nav-item"><a class="nav-link fw-semibold" href="review.html" style="color: #53645b;">Review</a></li>
                    <li class="nav-item"><a class="nav-link fw-semibold" href="statistik.html" style="color: #53645b;">Statistik</a></li>
                    <li class="nav-item"><a class="nav-link fw-semibold" href="peta.html" style="color: #53645b;">Peta Kuliner</a></li>
                    <li class="nav-item"><a class="nav-link fw-semibold" href="detail.html" style="color: #53645b;">Tentang</a></li>
                </ul>
            </div>
        </div>
    </nav>


    <main>
        <h1 class="page-title">Direktori Kuliner</h1>
        <p class="page-desc">Temukan tempat makan sesuai selera dan anggaranmu.</p>

        <div class="filter-card">
            <div class="form-group">
                <label for="searchName">Cari Tempat Makan</label>
                <input type="text" id="searchName" placeholder="Contoh: Warung Nasi...">
            </div>
            <div class="form-group">
                <label for="category">Kategori</label>
                <select id="category">
                    <option value="">Semua Kategori</option>
                    <option value="Makanan Berat">Makanan Berat</option>
                    <option value="Makanan Ringan">Makanan Ringan</option>
                    <option value="Minuman">Minuman</option>
                    <option value="Mie & Bakso">Mie & Bakso</option>
                </select>
            </div>
        </div>

        <div class="result-bar">
            <span id="resultCount">Memuat data...</span>
            <button class="btn-reset" id="resetBtn">Reset Filter</button>
        </div>


        <div class="food-grid" id="foodGrid"></div>
    </main>


    <footer class="footer">
    <div class="container d-flex flex-column flex-md-row justify-content-between gap-2">
           <div><strong>JakPus</strong>
                <div class="small opacity-75">Jajanan Anak Kampus.</div>
            </div>
            <div class="small opacity-75">Web Project UTS</div>
        </div>
    </footer>

    <script>
        const dataMakanan = [
            { nama: 'Ayam Geprek & Oseng Jando Matah Berkat Box', kategori: 'Makanan Berat', harga: 15000, rating: 4.8, img: 'ayamgeprek.jpg', desc: 'Menu rumahan, sayur, dan lauk harian.' },
            { nama: 'Tongseng Iga Kambing Mas Kris', kategori: 'Makanan Berat', harga: 20000, rating: 4.6, img: 'tongsengigakambing.jpg', desc: 'Tongseng Iga Kambing.' },
            { nama: 'Kedai Roti Ibu Saya', kategori: 'Makanan Ringan', harga: 5000, rating: 4.6, img: 'kedairoti.png', desc: 'Roti yang enak & murah.' },
            { nama: 'Warteg', kategori: 'Makanan Berat', harga: 10000, rating: 4.6, img: 'wartag.jpg', desc: 'Tempat masakan rumahan yang murah untuk semua kalangan.' },
            { nama: 'Mie Gacoan', kategori: 'Mie & Bakso', harga: 10000, rating: 4.7, img: 'gacoan.jpg', desc: 'Mienya yang enak dengan harga terjangkau.' },
            { nama: 'Bakso Gacoan', kategori: 'Mie & Bakso', harga: 15000, rating: 4.7, img: 'baksogacoan.jpg', desc: 'Yang lagi viral sekarang.' },
            { nama: 'Beri Kopi', kategori: 'Minuman', harga: 19000, rating: 4.3, img: 'berikopi.png', desc: 'Tempat nongkrong atau ngopi untuk semua kalangan.' }
        ];

        function tampilkanData(data) {
            const grid = document.getElementById('foodGrid');
            const infoJumlah = document.getElementById('resultCount');

            infoJumlah.innerText = data.length + ' tempat ditemukan';

            if (data.length === 0) {
                grid.innerHTML = '<div class="empty-state">Tidak ada tempat kuliner yang cocok.</div>';
                return;
            }

            let htmlCards = '';
            for (let i = 0; i < data.length; i++) {
                let item = data[i];
                htmlCards += `
                    <div class="card">
                        <img class="food-img" src="${item.img}" alt="${item.nama}">
                        <div class="card-body">
                            <span class="badge">${item.kategori}</span>
                            <h3 class="card-title">${item.nama}</h3>
                            <p class="card-desc">${item.desc}</p>
                            
                            <div class="card-footer">
                                <span class="rating">★ ${item.rating}</span>
                                <span class="price">Rp${item.harga.toLocaleString('id-ID')}</span>
                            </div>

                            <a href="review.html" class="link-review">Lihat semua review</a>
                        </div>
                    </div>
                `;
            }

            grid.innerHTML = htmlCards;
        }

        function prosesFilter() {
            let keyword = document.getElementById('searchName').value.toLowerCase();
            let kategoriPilihan = document.getElementById('category').value;
            let hasilFilter = [];

            for (let i = 0; i < dataMakanan.length; i++) {
                let item = dataMakanan[i];
                let cocokNama = item.nama.toLowerCase().includes(keyword);
                let cocokKategori = (kategoriPilihan === "") || (item.kategori === kategoriPilihan);

                if (cocokNama && cocokKategori) {
                    hasilFilter.push(item);
                }
            }
            tampilkanData(hasilFilter);
        }

        document.getElementById('searchName').addEventListener('input', prosesFilter);
        document.getElementById('category').addEventListener('change', prosesFilter);

        document.getElementById('resetBtn').addEventListener('click', function() {
            document.getElementById('searchName').value = '';
            document.getElementById('category').value = '';
            tampilkanData(dataMakanan);
        });

        tampilkanData(dataMakanan);
    </script>
</body>

</html>
