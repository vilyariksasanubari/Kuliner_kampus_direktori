<!doctype html>
<html lang="id">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Direktori | RasaKampus</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/datatables.net-dt@2.1.8/css/dataTables.dataTables.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <style>
        :root {
            --ink: #172b24;
            --muted: #6b7b72;
            --green: #176b4b;
            --lime: #dff3e7;
            --cream: #fbfaf6;
            --orange: #f29b50
        }

        body {
            background: var(--cream);
            color: var(--ink);
            font-family: Inter, system-ui, -apple-system, Segoe UI, sans-serif
        }

        .navbar {
            background: #fff !important;
            border-bottom: 1px solid #e8eee9
        }

        .navbar-brand {
            font-weight: 800;
            color: var(--green) !important;
            letter-spacing: -.5px
        }

        .nav-link {
            font-weight: 600;
            color: #53645b !important
        }

        .nav-link.active,
        .nav-link:hover {
            color: var(--green) !important
        }

        .hero {
            background: linear-gradient(120deg, #e7f5eb, #f8f5e9);
            border-radius: 28px;
            padding: clamp(28px, 5vw, 64px);
            overflow: hidden
        }

        .eyebrow {
            color: var(--green);
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-size: .75rem
        }

        .display-title {
            font-weight: 850;
            letter-spacing: -2px;
            line-height: 1.04
        }

        .btn-success {
            background: var(--green);
            border-color: var(--green)
        }

        .btn-success:hover {
            background: #10553a
        }

        .btn-outline-success {
            border-color: var(--green);
            color: var(--green)
        }

        .card {
            border: 1px solid #e9eee9;
            border-radius: 18px;
            box-shadow: 0 8px 28px rgba(27, 60, 42, .045)
        }

        .food-img {
            height: 180px;
            object-fit: cover;
            border-radius: 16px 16px 0 0
        }

        .rating {
            color: #d98a26;
            font-weight: 800
        }

        .muted {
            color: var(--muted)
        }

        .stat-card {
            background: #fff;
            border-radius: 18px;
            padding: 22px;
            border: 1px solid #e9eee9
        }

        .stat-number {
            font-size: 2rem;
            font-weight: 850;
            color: var(--green)
        }

        .section-space {
            padding: 52px 0
        }

        .footer {
            background: #142d23;
            color: #dce9e0;
            padding: 34px 0;
            margin-top: 60px
        }

        .form-control,
        .form-select {
            border-radius: 12px;
            padding: .7rem .9rem
        }

        .badge-soft {
            background: var(--lime);
            color: var(--green)
        }

        #campusMap {
            height: 390px;
            border-radius: 18px;
            z-index: 1
        }

        .table thead th {
            background: #eff7f1;
            color: #345342
        }

        .review-avatar {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: #dff3e7;
            color: var(--green);
            display: grid;
            place-items: center;
            font-weight: 800
        }

        @media(max-width:576px) {
            .display-title {
                letter-spacing: -1px
            }

            .section-space {
                padding: 34px 0
            }
        }
    </style>
</head>

<body>
    <nav class="navbar navbar-expand-lg sticky-top">
        <div class="container"><a class="navbar-brand" href="index.html">🍃 RasaKampus</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMain"><span
                    class="navbar-toggler-icon"></span></button>
            <div class="collapse navbar-collapse" id="navMain">
                <ul class="navbar-nav ms-auto gap-lg-2">
                    <li class="nav-item"><a class="nav-link" href="index.html">Beranda</a></li>
                    <li class="nav-item"><a class="nav-link" href="direktori.html">Direktori</a></li>
                    <li class="nav-item"><a class="nav-link" href="review.html">Review</a></li>
                    <li class="nav-item"><a class="nav-link" href="statistik.html">Statistik</a></li>
                    <li class="nav-item"><a class="nav-link" href="peta.html">Peta Kuliner</a></li>
                    <li class="nav-item"><a class="nav-link" href="detail.html">Tentang</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container section-space">
        <div class="eyebrow">Eksplorasi</div>
        <h1 class="display-title display-5 mt-2">Direktori kuliner</h1>
        <p class="muted mb-4">Temukan tempat makan sesuai selera dan anggaranmu.</p>
        <div class="card p-3 p-md-4 mb-4">
            <div class="row g-3">
                <div class="col-md-4"><label class="form-label fw-semibold">Cari tempat makan</label><input
                        id="searchName" class="form-control" placeholder="Contoh: ayam geprek..."></div>
                <div class="col-md-3"><label class="form-label fw-semibold">Kategori</label><select id="category"
                        class="form-select">
                        <option value="">Semua kategori</option>
                        <option>Masakan Rumahan</option>
                        <option>Mie & Bakso</option>
                        <option>Ayam & Bebek</option>
                        <option>Kopi & Minuman</option>
                        <option>Jajanan</option>
                    </select></div>
                <div class="col-md-2"><label class="form-label fw-semibold">Harga maksimal</label><select id="price"
                        class="form-select">
                        <option value="999999">Semua harga</option>
                        <option value="10000">≤ Rp10.000</option>
                        <option value="20000">≤ Rp20.000</option>
                        <option value="30000">≤ Rp30.000</option>
                    </select></div>
                <div class="col-md-3"><label class="form-label fw-semibold">Rating minimum</label><select id="rating"
                        class="form-select">
                        <option value="0">Semua rating</option>
                        <option value="4">4.0 ke atas</option>
                        <option value="4.5">4.5 ke atas</option>
                    </select></div>
            </div>
        </div>
        <div class="d-flex justify-content-between mb-3"><span class="muted small" id="resultCount"></span><button
                class="btn btn-sm btn-outline-success" id="reset">Reset filter</button></div>
        <div class="row g-4" id="foodGrid"></div>
    </main>
    <footer class="footer">
        <div class="container d-flex flex-column flex-md-row justify-content-between gap-2">
            <div><strong>RasaKampus</strong>
                <div class="small opacity-75">Temukan rasa favorit di sekitar kampus.</div>
            </div>
            <div class="small opacity-75">Prototipe tugas Pengembangan Frontend · Data contoh</div>
        </div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/datatables.net@2.1.8/js/dataTables.min.js"></script>
    <script src="https://code.highcharts.com/highcharts.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const foods = [
            ['Warung Nasi Bu Tini', 'Masakan Rumahan', 15000, 4.8, 'photo-1547592180-85f173990554', 'Menu rumahan, sayur, dan lauk harian.'],
            ['Kedai Mie Sudut', 'Mie & Bakso', 12000, 4.6, 'photo-1569718212165-3a8278d5f624', 'Mie ayam dan bakso favorit mahasiswa.'],
            ['Ayam Geprek Bara', 'Ayam & Bebek', 18000, 4.5, 'photo-1626082927389-6cd097cdc6ec', 'Ayam geprek dengan level sambal.'],
            ['Kopi Selasar', 'Kopi & Minuman', 22000, 4.7, 'photo-1509042239860-f550ce710b93', 'Kopi, non-kopi, dan ruang belajar santai.'],
            ['Pisang Crispy 88', 'Jajanan', 10000, 4.3, 'photo-1528823872057-9c018a7a7553', 'Camilan manis untuk teman istirahat.'],
            ['Soto Pojok', 'Masakan Rumahan', 20000, 4.4, 'photo-1547592166-23ac45744acd', 'Soto hangat dengan pilihan lauk.'],
            ['Bakso Pak Rudi', 'Mie & Bakso', 16000, 4.2, 'photo-1565299624946-b28f40a0ae38', 'Bakso kuah dan mie dengan porsi pas.'],
            ['Rice Bowl Kampus', 'Ayam & Bebek', 25000, 4.6, 'photo-1512058564366-18510be2db19', 'Rice bowl praktis untuk makan siang.']
        ];
        function render() {
            let q = document.getElementById('searchName').value.toLowerCase(), c = document.getElementById('category').value, p = +document.getElementById('price').value, r = +document.getElementById('rating').value;
            let list = foods.filter(f => f[0].toLowerCase().includes(q) && (!c || f[1] === c) && f[2] <= p && f[3] >= r);
            document.getElementById('resultCount').textContent = list.length + ' tempat ditemukan';
            document.getElementById('foodGrid').innerHTML = list.map(f => `<div class="col-sm-6 col-lg-3"><div class="card h-100 overflow-hidden"><img class="food-img" src="https://images.unsplash.com/${f[4]}?w=600" alt="${f[0]}"><div class="card-body d-flex flex-column"><span class="badge badge-soft align-self-start">${f[1]}</span><h5 class="fw-bold mt-2">${f[0]}</h5><p class="muted small flex-grow-1">${f[5]}</p><div class="d-flex justify-content-between"><span class="rating">★ ${f[3]}</span><strong>Rp${f[2].toLocaleString('id-ID')}</strong></div><a class="btn btn-sm btn-outline-success mt-3" href="review.html">Lihat review</a></div></div></div>`).join('') || '<div class="col-12 text-center py-5 muted">Tidak ada tempat yang cocok. Coba ubah filter.</div>'
        }
        ['searchName', 'category', 'price', 'rating'].forEach(id => document.getElementById(id).addEventListener(id === 'searchName' ? 'input' : 'change', render)); document.getElementById('reset').onclick = () => {['searchName', 'category'].forEach(id => document.getElementById(id).value = ''); price.value = '999999'; rating.value = '0'; render()}; render();
    </script>
</body>

</html>
